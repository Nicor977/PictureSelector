# Veröffentlicht den Picture Selector auf GitHub Pages, sobald etwas auf main landet.
# Einmalig nötig: Settings → Pages → Source: "GitHub Actions".
name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Nur die App-Dateien zusammenstellen
        run: |
          mkdir -p _site
          cp index.html _site/
          cp -r lib _site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
